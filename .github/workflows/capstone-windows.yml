name: Build Windows Static Library (Capstone)

on:
  push:
    branches: [ main, master, develop, '*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    
    - name: Configure CMake
      run: |
        mkdir build-windows
        cd build-windows
        cmake .. `
          -G "Visual Studio 17 2022" `
          -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DCAPSTONE_ARM64_SUPPORT=ON `
          -DCAPSTONE_ARM_SUPPORT=ON `
          -DCAPSTONE_BUILD_TESTS=OFF `
          -DCAPSTONE_BUILD_SHARED=OFF `
          -DCAPSTONE_BUILD_STATIC=ON

    - name: Build for Windows (x64)
      run: |
        cd build-windows
        cmake --build . --config Release --target capstone

    - name: Package Library
      run: |
        mkdir -p universal/lib
        # MSVC 编译的静态库默认输出到 Release 文件夹下
        cp build-windows/Release/capstone.lib universal/lib/
        
        # 复制头文件
        mkdir -p universal/include/capstone
        cp -r include/* universal/include/capstone/
        
        # 打包成zip
        cd universal
        Compress-Archive -Path * -DestinationPath ../capstone-windows.zip

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: capstone-windows
        path: capstone-windows.zip
